<!doctype html>
<html lang="fr">
<!-- Supabase e-mail template "Magic Link" (Authentication > Emails). Subject: Ton code Movie Night -->
<!-- Inline styles and tables only: most mail apps drop <style> blocks and modern layout. -->
  <body style="margin:0;padding:0;background-color:#e8efea;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#e8efea;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#f5f9f6;border:1px solid #b8893b;">
            <tr>
              <td align="center" style="background-color:#0e4d3c;padding:28px 24px 22px;">
                <img src="https://anthonydebeauvais20-rgb.github.io/movie-night/pwa-192x192.png" width="56" height="56" alt="" style="display:block;border:0;" />
                <p style="margin:14px 0 0;font-family:'Josefin Sans',Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#f1e7c9;">Movie Night</p>
              </td>
            </tr>
            <tr>
              <td style="height:3px;line-height:3px;font-size:0;border-top:1px solid #b8893b;border-bottom:1px solid #b8893b;background-color:#0e4d3c;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:32px 32px 8px;font-family:Jost,Arial,Helvetica,sans-serif;color:#0e3b2e;">
                <h1 style="margin:0;font-family:'Josefin Sans',Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:#0e3b2e;">Ton code de connexion</h1>
                <p style="margin:14px 0 0;font-size:16px;line-height:24px;">Entre ce code dans Movie Night pour te connecter :</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 32px;">
                <p style="margin:0;display:inline-block;padding:14px 22px;border:1px solid #b8893b;background-color:#dce7e0;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#0e3b2e;">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;font-family:Jost,Arial,Helvetica,sans-serif;font-size:14px;line-height:21px;color:#4f6f63;">
                <p style="margin:0;">Il est valable une heure.</p>
                <p style="margin:12px 0 0;">Si tu n’as rien demandé, ignore cet e-mail : personne ne peut se connecter sans ce code.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 32px;border-top:1px solid #dce7e0;font-family:Jost,Arial,Helvetica,sans-serif;font-size:12px;color:#4f6f63;">
                <a href="{{ .SiteURL }}" style="color:#0e4d3c;font-weight:600;text-decoration:underline;">Ouvrir Movie Night</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
